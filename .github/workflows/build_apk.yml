name: Build and Release Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Complete Platform Scaffolding
        working-directory: ./PharmacyQandilHR_Mobile
        run: |
          flutter create . --platforms=android --org com.pharmacyqandil

      - name: Get Dependencies
        working-directory: ./PharmacyQandilHR_Mobile
        run: |
          flutter pub get

      - name: Build APK (Release)
        working-directory: ./PharmacyQandilHR_Mobile
        run: |
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmacyQandilHR-APK
          path: PharmacyQandilHR_Mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.0
          name: "Pharmacy Qandil HR v1.0.0 (APK)"
          body: "Official Android APK release for Pharmacy Qandil HR Mobile App."
          files: PharmacyQandilHR_Mobile/build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
