name: Build and Release Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: ./PharmacyQandilHR_Mobile
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Build APK (Release)
        working-directory: ./PharmacyQandilHR_Mobile
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmacyQandilHR-APK
          path: PharmacyQandilHR_Mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Pharmacy Qandil HR v1.0.1 (APK - Fixed Layout & Localization)"
          body: "Fixed Kurdish RTL localization & layout rendering on Android devices."
          files: PharmacyQandilHR_Mobile/build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}